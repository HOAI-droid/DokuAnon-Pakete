# Datenpakete (Sprachmodelle, Texterkennung, PDF-Bibliothek), die bei der Installation
# nachgeladen werden. Diese Datei ist die EINZIGE Stelle mit der Paketquelle – ein Umzug
# (GitHub, Cloudflare R2, Hugging Face, eigener Server) ändert nur `quelle` (und `aktuell`).
#
# Jedes Paket braucht: Lizenz (nur permissive, siehe deny.toml), Herkunft, Größe und SHA-256.
# Ein Test (crates/pakete) prüft diese Angaben. Die Pakete selbst werden NIE committet.

# Öffentliches Paket-Verzeichnis (GitHub): Pakete als Release-Dateien, gebaut vom Ablauf
# „Pakete veröffentlichen“ dort (Vorlage: werkzeuge/paketquelle). Neue Pakete → neue Kennung.
quelle = "https://github.com/HOAI-droid/DokuAnon-Pakete/releases/download/pakete-1"

# Neueste Version von DokuAnon (Hinweis auf Aktualisierung, höchstens 1× täglich, abschaltbar).
aktuell = "https://raw.githubusercontent.com/HOAI-droid/DokuAnon-Pakete/main/aktuell.json"

# Plattform-Kennung: <System>-<Prozessor> wie in Rust (windows-x86_64, linux-x86_64, macos-aarch64).
# Bauen und prüfen: python -I werkzeuge/pakete_bauen.py <ordner>

